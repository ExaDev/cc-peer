name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
          cache: pnpm
          # Do NOT set registry-url — it creates an .npmrc that overrides OIDC trusted publishing.

      - name: Install latest npm for trusted publishing
        run: pnpm exec npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      # The changelog commit-back pushes directly to main, which the branch ruleset refuses for the workflow token. Mint an installation token for the exadev App (the ruleset's permitted bypasser) instead.
      - name: Generate ExaDev App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ExaDev
          repositories: cc-peer

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Explicitly blank: OIDC trusted publishing must be the only credential path.
          NODE_AUTH_TOKEN: ""
          HUSKY: "0"
        run: pnpm exec semantic-release

  sea:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: macos-13
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # The release tag, not the triggering SHA: semantic-release computed the version at release time and the tag names it, while the triggering commit's own package.json still carries the pre-bump version.
      - name: Resolve the release tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ steps.tag.outputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the SEA bundle
        run: pnpm build

      # A distribution of even a new-enough Node can ship with the SEA feature compiled out (Homebrew bottles do), so pin one specific version confirmed to have it enabled rather than "latest" — a future Node release can then never silently break this step.
      - name: Install a Node build with SEA support
        uses: actions/setup-node@v5
        with:
          node-version: "26.8.1"

      - name: Build the single executable
        id: build
        shell: bash
        run: |
          BINARY_PATH="$(node --experimental-strip-types scripts/build-sea.ts)"
          echo "binary-path=$BINARY_PATH" >> "$GITHUB_OUTPUT"

      - name: Smoke the binary
        run: |
          BINARY="${{ steps.build.outputs.binary-path }}"
          chmod +x "$BINARY"
          # The server runs until signalled; printing its startup banner within a 5s background window is the pass condition.
          "$BINARY" --name sea-smoke > smoke.log 2>&1 &
          PID=$!
          sleep 5
          kill "$PID" || true
          grep -q "REST facade listening" smoke.log

      - name: Upload the binary as a release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" --clobber "${{ steps.build.outputs.binary-path }}"

